name: autotag

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag the current version if the tag is missing
        run: |
          v="v$(grep -oP '__version__ = "\K[0-9]+\.[0-9]+\.[0-9]+' swrm.py | head -1)"
          if git rev-parse "$v" >/dev/null 2>&1; then
            echo "$v already exists; nothing to do"
            exit 0
          fi
          git config user.name "release-bot"
          git config user.email "actions@github.com"
          git tag -a "$v" -m "swarmboard $v"
          git push origin "$v"
