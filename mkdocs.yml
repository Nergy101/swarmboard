site_name: swarmboard
site_description: One board. The whole swarm. A CLI-first kanban board (swrm) for multi-agent swarms.
docs_dir: docs/src
site_dir: docs/site

theme:
  name: material
  logo: images/logo.svg
  favicon: images/favicon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - content.code.copy

markdown_extensions:
  - fenced_code
  - tables
  - admonition
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Install: install.md
  - Quickstart: quickstart.md
  - Multi-agent (one PC): multi-agent.md
  - Leader-follower (multi-PC): leader-follower.md
  - Commands: commands.md
  - Skill: skill.md
  - Development: development.md
